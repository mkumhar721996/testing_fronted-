<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="prototype-utils.css">
<title>App shell: Sidebar app shell</title>
<style>
.app-shell { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }
.app-shell[data-shell="topnav"] { display: block; }
.app-nav {
  display: flex; flex-direction: column; gap: var(--space-1); padding: var(--density-padding);
  background: var(--color-surface); border-right: var(--border-width) solid var(--color-border);
}
.app-brand { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-family-heading); font-weight: var(--font-weight-heading); color: var(--color-fg); text-decoration: none; }
.app-brand-mark { display: inline-grid; place-items: center; width: var(--control-height-sm); aspect-ratio: 1; border-radius: var(--radius-control); background: var(--color-primary); color: var(--color-on-primary); font-size: var(--font-size-sm); }
.app-nav-item {
  display: flex; align-items: center; gap: var(--space-3); min-height: var(--control-height-md); padding: 0 var(--space-3);
  border-radius: var(--radius-control); color: var(--color-fg-muted); font-weight: var(--font-weight-medium); text-decoration: none;
  transition: background-color var(--motion-transition), color var(--motion-transition);
}
.app-nav-item:hover { background: var(--color-surface-subtle); color: var(--color-fg); }
.app-nav-item[aria-current="page"] { background: var(--color-primary-soft); color: var(--color-primary-text); }
.app-main { display: flex; flex-direction: column; min-width: 0; min-height: 100vh; }
.app-header {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); min-height: var(--header-height);
  padding: 0 var(--page-gutter); background: var(--color-surface); border-bottom: var(--border-width) solid var(--color-border);
}
.app-header-spacer { flex: 1; }
.app-content { flex: 1; width: 100%; max-width: var(--container-xl); margin-inline: auto; padding: var(--density-padding) var(--page-gutter); min-width: 0; }
.app-footer { padding: var(--space-4) var(--page-gutter); border-top: var(--border-width) solid var(--color-border); color: var(--color-fg-faint); font-size: var(--font-size-sm); }
.app-menu { display: none; }
.app-shell[data-shell="topnav"] .app-header .app-nav { flex-direction: row; flex-wrap: wrap; padding: 0; background: none; border: 0; order: 3; width: 100%; overflow-x: auto; }
@media (max-width: 819px) {
  .app-shell { grid-template-columns: minmax(0, 1fr); }
  .app-menu { display: inline-flex; }
  .app-nav { position: fixed; inset: 0 auto 0 0; z-index: var(--z-overlay); width: min(18rem, 85%); box-shadow: var(--shadow-3); }
}
@media (min-width: 820px) { .app-nav[hidden] { display: flex !important; } }
</style>
</head>
<body>
<div class="app-shell" data-arc-shell data-shell="sidebar">
<svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
<symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Home</title><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9.5 21v-6h5v6"/></symbol>
<symbol id="i-kanban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Board</title><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 7v8M15 7v4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Done</title><circle cx="12" cy="12" r="10"/><path d="m8 12.2 2.8 2.8 5.2-5.6"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Calendar</title><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Assignee</title><circle cx="12" cy="8" r="4"/><path d="M4 21v-1c0-3.3 3.6-6 8-6s8 2.7 8 6v1z"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Team</title><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1c0-2.8 2.9-5 6.5-5s6.5 2.2 6.5 5v1z"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.5c1.8.7 3 2.1 3 4.5v1"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Alerts</title><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9z"/><path d="M10 21h4"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Search</title><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Settings</title><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Create</title><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></symbol>
<symbol id="i-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Filter</title><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Priority</title><path d="M5 4h12l-2 4 2 4H5z"/><path d="M5 3v18"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Due</title><circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Label</title><path d="M3 3h8.5L21 12.5 12.5 21 3 11.5z"/><circle cx="7.5" cy="7.5" r="1.2"/></symbol>
<symbol id="i-msg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Comment</title><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z"/><path d="M8 9h8M8 13h5"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Delete</title><path d="M5 7h14l-1 14H6z"/><path d="M3 7h18M9 7V4h6v3"/><path d="M10 11v6M14 11v6"/></symbol>
</svg>
<nav id="app-nav" class="app-nav" data-arc-shell-part="nav" aria-label="Main" hidden><a class="app-brand" href="#"><span class="app-brand-mark" aria-hidden="true">P</span><span>Product</span></a>
  <a class="app-nav-item" href="#" data-nav-key="overview" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span class="app-nav-label">Overview</span></a>
  <a class="app-nav-item" href="#" data-nav-key="boards"><svg class="icon" aria-hidden="true"><use href="#i-kanban"/></svg><span class="app-nav-label">Boards</span></a>
  <a class="app-nav-item" href="#" data-nav-key="my-tasks"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span class="app-nav-label">My tasks</span></a>
  <a class="app-nav-item" href="#" data-nav-key="settings"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span class="app-nav-label">Settings</span></a>
</nav>
<div class="app-main">
<header class="app-header" data-arc-shell-part="header">
  <button class="btn btn-ghost btn-icon app-menu" type="button" data-toggle="app-nav" aria-controls="app-nav" aria-expanded="false" aria-label="Menu"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
  <div class="app-header-spacer"></div>
  <button class="btn btn-ghost btn-icon" type="button" aria-label="Search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg></button>
  <button class="btn btn-ghost btn-icon" type="button" aria-label="Alerts"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg></button>
  <span class="avatar" aria-hidden="true">AB</span>
  
</header>
<main class="app-content" data-arc-content></main>
<footer class="app-footer" data-arc-shell-part="footer">Product name · Help · Privacy</footer>
</div>
</div>
</body>
</html>
